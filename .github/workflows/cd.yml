name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile_prod
          push: true
          tags: 1sibo18/microblog:${{ env.VERSION }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}

  deploy:
      needs: build-and-push
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-python@v7
          with:
            python-version: "3.11"
            cache: pip
            cache-dependency-path: requirements/deploy.txt

        - name: Install Ansible
          run: pip install -r requirements/deploy.txt

        - name: Save the ssh key
          run: |
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          env:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

        - name: Run the playbook
          working-directory: ansible
          run: ansible-playbook -i prod_hosts deploy_application.yml --private-key ~/.ssh/id_ed25519      
