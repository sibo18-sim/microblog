---

- name: Fetch tags from GitHub API
  uri:
    url: "https://api.github.com/repos/sibo18-sim/microblog/tags"
    return_content: true
  register: tags
  delegate_to: localhost
  become: false
  when: app_version is not defined

- name: Get latest app version
  set_fact:
    app_version: "{{ tags.json[0].name | regex_replace('^v', '') }}"
  when: app_version is not defined

- name: Install Docker
  apt:
    name:
      - docker.io
      - python3-docker
    state: present
    update_cache: yes

- name: Start and enable Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Start Microblog container
  community.docker.docker_container:
    name: microblog
    image: "1sibo18/microblog:{{ app_version }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "8000:5000"
    env:
      SECRET_KEY: my-secret-key
      DATABASE_URL: "mysql+pymysql://microblog:microblogpassword@{{ domain_name }}/microblog"
